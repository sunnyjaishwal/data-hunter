<!DOCTYPE html>
<html>
<head>
    <title> Verify OTP</title>
</head>
<body>
    <h2>Enter OTP to Reset Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors}}
        <div>
            <label for="{{ form.otp.id_for_label }}">Otp</label>
            {{ form.otp }}
            {{ form.otp.errors }}
        </div>
        <button type="submit">Reset Password</button>
    </form>
</body>
</html>
