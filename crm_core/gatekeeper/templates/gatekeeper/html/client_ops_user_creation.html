<!DOCTYPE html>
<html>
<head>
    <title>Create Operation User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafc;
            padding: 2rem;
            color: #2c3e50;
        }
        .form-container {
            max-width: 450px;
            background: white;
            padding: 2rem;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #294e87;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: .5rem;
            margin-top: 0.25rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .errorlist {
            color: red;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            list-style-type: none;
            padding-left: 0;
        }
        button {
            margin-top: 1.5rem;
            width: 100%;
            background-color: #294e87;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #16325c;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Client Operations User</h2>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            
            <label for="{{ form.email.id_for_label }}">Email</label>
            {{ form.email }}
            {{ form.email.errors }}

            <label for="{{ form.full_name.id_for_label }}">Full Name</label>
            {{ form.full_name }}
            {{ form.full_name.errors }}

            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
            {{ form.password.errors }}

            <label for="{{ form.confirm_password.id_for_label }}">Confirm Password</label>
            {{ form.confirm_password }}
            {{ form.confirm_password.errors }}

            <button type="submit">Create User</button>
        </form>
    </div>
</body>
</html>
